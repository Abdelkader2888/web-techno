<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Заказы — Food Construct</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="builder.css" />
    <script src="api.js" defer></script>
    <script src="data.js" defer></script>
    <script src="orders.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Food Construct</h1>
      <nav>
        <a href="index.html#about">О нас</a>
        <a href="builder.html">Собрать ланч</a>
        <a href="order.html">Оформить заказ</a>
        <a class="active" href="orders.html">Заказы</a>
        <a href="#contacts">Контакты</a>
      </nav>
    </header>
    <main>
      <section>
        <h2>Мои заказы</h2>
        <p id="orders-status" role="status"></p>
        <div id="orders-list" class="orders-list"></div>
      </section>
    </main>
    <dialog id="details-dialog" class="order-dialog">
      <button class="close-modal" type="button" aria-label="Закрыть">×</button>
      <h2>Информация о заказе</h2>
      <div id="details-content"></div>
      <div class="dialog-actions">
        <button type="button" data-close="details-dialog">Ок</button>
      </div>
    </dialog>
    <dialog id="edit-dialog" class="order-dialog">
      <button class="close-modal" type="button" aria-label="Закрыть">×</button>
      <h2>Редактирование заказа</h2>
      <form id="edit-form" novalidate>
        <label for="edit-name">Имя</label>
        <input id="edit-name" name="full_name" type="text" required />
        <label for="edit-email">Email</label>
        <input id="edit-email" name="email" type="email" required />
        <label for="edit-phone">Номер телефона</label>
        <input id="edit-phone" name="phone" type="tel" required />
        <label for="edit-address">Адрес доставки</label>
        <input id="edit-address" name="delivery_address" type="text" required />
        <label for="edit-delivery-type">Время доставки</label>
        <select id="edit-delivery-type" name="delivery_type" required>
          <option value="" disabled selected>Выберите время доставки</option>
          <option value="now">Как можно скорее</option>
          <option value="by_time">К указанному времени</option>
        </select>
        <label for="edit-delivery-time">Укажите время доставки</label>
        <input id="edit-delivery-time" name="delivery_time" type="time" min="07:00" max="23:00" step="300" />
        <label for="edit-comment">Комментарий</label>
        <textarea id="edit-comment" name="comment" rows="4"></textarea>
        <div class="dialog-actions">
          <button type="submit">Сохранить</button>
          <button type="button" data-close="edit-dialog">Отмена</button>
        </div>
      </form>
    </dialog>
    <dialog id="delete-dialog" class="order-dialog">
      <button class="close-modal" type="button" aria-label="Закрыть">×</button>
      <h2>Удаление заказа</h2>
      <p>Вы действительно хотите удалить этот заказ?</p>
      <div class="dialog-actions">
        <button id="confirm-delete" type="button">Да</button>
        <button type="button" data-close="delete-dialog">Отмена</button>
      </div>
    </dialog>
    <footer id="contacts">
      <p>Позвонить нам <a href="tel:+70000000000">+7-000-000-00-00</a></p>
    </footer>
  </body>
</html>
